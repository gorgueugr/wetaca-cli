query nextSuggestion {
  nextSuggestion {
    appliedVoucher {
      code
      tagNames
      appliedDiscount
      discount {
        price
        percent
      }
    }
    billingAddress {
      id
      name
      lastname
      country
      vat
      street
      number
      floor
      zipcode
      city
    }
    delivery {
      address {
        id
        firstname
        lastname
        street
        number
        zipcode
        city
        phone
        floor
        notes
      }
      notes
      option {
        start
        end
        price
        customizedPrice
        custom
        exception {
          start
          end
          from {
            year
            month
            dayOfMonth
          }
        }
      }
    }
    _id
    pausedAt
    skip
    skipVoucher
    validUntil
    salesPlanId
    hasDeliveryChanges
    viewedInEditableState
    suggestionPricing {
      profiles {
        id
        transactional
        subscription
        toPay
      }
      profilesTotal {
        transactional
        subscription
        toPay
      }
      shipping
      salesPlanDiscount
      vouchers
      subscription {
        subtotal
        total
      }
      transactional {
        subtotal
        total
      }
      toPay
      salesPlan {
        _id
        id
        minProfilesPriceValidation {
          minPrice
          result
          remainingAmount
        }
        packageOption {
          index
          categoryRestrictions {
            categories
            restriction {
              min
              max
            }
          }
          shippingSubscriptionDiscount {
            assumed
          }
          baseCategory
          baseCategoryPrice
        }
        packageValidation {
          result
          restrictions {
            categories
            result
            remaining
          }
        }
        upselling {
          packageOption {
            index
            categoryRestrictions {
              categories
              restriction {
                min
                max
              }
            }
            shippingSubscriptionDiscount {
              assumed
            }
            baseCategory
            baseCategoryPrice
          }
          packageValidation {
            result
            restrictions {
              categories
              result
              remaining
            }
          }
        }
      }
      appliedSalesPlanDiscount {
        appliedDiscount
        discount {
          price
          percent
        }
      }
      appliedVouchers {
        code
        tagNames
        appliedDiscount
        discount {
          price
          percent
        }
      }
      voucherApplyErrors {
        ... on ApplyVoucherValidationError {
          errorCode
          description
          validationDetails {
            validationIssue
            voucher {
              code
              restrict {
                maximumAmount
                minimumAmount
                firstOrder
              }
            }
          }
        }
        ... on GraphError {
          errorCode
        }
      }
      skippedProfiles {
        id
        transactional
        subscription
        toPay
      }
    }
    accountIsActive
    currentOrderStreakProgress
    profileSuggestions {
      id
      products {
        id
        category {
          _id
          slug
          subscriptionPrice
          description
          name
          order
        }
        name
        slug
        price
        quantity
        subscriptionPrice
        allergens
        ingredients
        nutritionFacts {
          energy
          fiber
          hydrates
          proteins
          salt
          saturatedFat
          sugars
          totalFat
        }
        tags
      }
      productMap {
        id
        quantity
        day
      }
      profileId
      maxPriceWithoutChanges
      skip
      hasChanges
    }
  }
}
