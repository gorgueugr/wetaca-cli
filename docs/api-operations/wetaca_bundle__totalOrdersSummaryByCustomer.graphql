query totalOrdersSummaryByCustomer {
  totalOrdersSummaryByCustomer {
    subscriptionOrdersMetadata {
      confirmed
      first {
        date
      }
    }
    transactionalOrdersMetadata {
      confirmed
      first {
        date
      }
    }
    totalOrders
    totalDeliveredOrders
  }
  getChargingSuggestionMetadata {
    isChargingIntervalAndSuggestionHasBeenCharged
  }
}
