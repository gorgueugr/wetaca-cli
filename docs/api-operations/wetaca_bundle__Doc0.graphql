fragment MyDetailsMenuSuggestion on SuggestionWithProfilesGraph {
  _id
  skip
  profileSuggestions {
    _id
    skip
    products {
      id
      quantity
    }
  }
  delivery {
    option {
      id
      start
      end
      price
      customizedPrice
      custom
      exception {
        start
        end
        from {
          year
          month
          dayOfMonth
        }
      }
    }
  }
  suggestionPricing {
    salesPlan {
      minProfilesPriceValidation {
        minPrice
        result
        remainingAmount
      }
    }
  }
}
