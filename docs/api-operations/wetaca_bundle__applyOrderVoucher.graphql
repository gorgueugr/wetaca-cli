query applyOrderVoucher($orderInput: OrderInput!) {
  applyOrderVouchers(orderInput: $orderInput) {
    ... on AppliedVouchers {
      vouchers {
        code
        tagNames
        appliedDiscount
        discount {
          price
          percent
        }
      }
    }
    ... on ApplyVoucherValidationError {
      errorCode
      description
      validationDetails {
        validationIssue
        voucher {
          code
          restrict {
            maximumAmount
            minimumAmount
            firstOrder
          }
        }
      }
    }
    ... on GraphError {
      errorCode
    }
  }
}
