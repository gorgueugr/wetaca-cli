query getDeliveryConfigurationProductAvailabilityWithExceptions($segmentId: ModelId!, $date: DateTime) {
  getDeliveryConfigurationProductAvailability(segmentId: $segmentId, date: $date, isSubscriptionIntent: true) {
    optionsWithRestrictions {
      _id
      id
      maxQuantity
      configurationDay
      deliveryDateDay
      start
      end
      configurationDate {
        start
        end
      }
    }
    exceptions {
      start
      end
      day
      from {
        year
        month
        dayOfMonth
      }
    }
    maxTotalQuantityRestriction
  }
}
