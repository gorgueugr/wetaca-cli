query suggestionChangePricing($suggestionId: ModelId!, $accountSuggestionChange: SuggestionChangeGraph, $profileSuggestionChanges: [ProfileSuggestionChangeGraph!], $deliveryConfigurationChange: DeliveryConfigurationInput) {
  suggestionChangePricing(suggestionId: $suggestionId, accountSuggestionChange: $accountSuggestionChange, profileSuggestionChanges: $profileSuggestionChanges, deliveryConfigurationChange: $deliveryConfigurationChange) {
    profiles {
      _id
      id
      profileId
      transactional
      subscription
      toPay
    }
    profilesTotal {
      transactional
      subscription
      toPay
    }
    shipping
    salesPlanDiscount
    vouchers
    subscription {
      subtotal
      total
    }
    transactional {
      subtotal
      total
    }
    toPay
    appliedSalesPlanDiscount {
      appliedDiscount
      discount {
        price
        percent
      }
    }
    salesPlan {
      _id
      id
      minProfilesPriceValidation {
        minPrice
        result
        remainingAmount
      }
      packageOption {
        index
        categoryRestrictions {
          categories
          restriction {
            min
            max
          }
        }
        shippingSubscriptionDiscount {
          assumed
        }
        baseCategory
        baseCategoryPrice
      }
      packageValidation {
        result
        restrictions {
          categories
          result
          remaining
        }
      }
      upselling {
        packageOption {
          index
          categoryRestrictions {
            categories
            restriction {
              min
              max
            }
          }
          shippingSubscriptionDiscount {
            assumed
          }
          baseCategory
          baseCategoryPrice
        }
        packageValidation {
          result
          restrictions {
            categories
            result
            remaining
          }
        }
      }
    }
    appliedVouchers {
      code
      tagNames
      appliedDiscount
      discount {
        price
        percent
      }
    }
    voucherApplyErrors {
      ... on ApplyVoucherValidationError {
        errorCode
        description
        validationDetails {
          validationIssue
          voucher {
            code
            restrict {
              maximumAmount
              minimumAmount
              firstOrder
            }
          }
        }
      }
      ... on GraphError {
        errorCode
      }
    }
  }
}
