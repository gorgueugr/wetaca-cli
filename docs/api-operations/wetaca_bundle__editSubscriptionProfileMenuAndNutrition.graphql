mutation editSubscriptionProfileMenuAndNutrition($profileId: ModelId!, $productsInput: [OrderProductMapGraph!]!, $nutritionInput: NutritionGraphInput!, $checkChargingSuggestion: Boolean) {
  editSubscriptionProfileMenuAndNutrition(profileId: $profileId, productsInput: $productsInput, nutritionInput: $nutritionInput, checkChargingSuggestion: $checkChargingSuggestion) {
    id
    name
    email
    isActive
    allergens {
      id
      name
    }
    otherAllergens
    dislikes {
      id
      flavor
      texture
      name
    }
    otherDislikes {
      name
      flavor
      texture
    }
    spicyLevel
    diet
    products {
      id
      name
      slug
      price
      subscriptionPrice
      category {
        _id
        slug
        subscriptionPrice
      }
      quantity
      tags
      features
      isPromoted
    }
    price
    nutrition {
      goal
      preferences {
        energy {
          min
          max
        }
        proteins
        hydrates
        fats
      }
    }
    character
  }
}
