mutation authorizePaypalTokenGenerationPaymentIntention($paymentIntentionId: ModelId!, $paymentIntentionSliceId: ModelId!, $paypalInitTokenId: String!) {
  authorizePaypalTokenGenerationPaymentIntention(paymentIntentionId: $paymentIntentionId, paymentIntentionSliceId: $paymentIntentionSliceId, paypalInitTokenId: $paypalInitTokenId) {
    ok
    error
    storedPaymentToken
  }
}
