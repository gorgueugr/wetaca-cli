query myDetailsAccountWithProfiles {
  subscriptionAccountByCustomer {
    id
    isActive
    pausedUntil
    optInSuggestions
    isOptInMutable
    payments {
      reference
    }
    profiles {
      id
      name
      price
      productMap {
        quantity
      }
      ...SubscriptionProfiles
      ...SubscriptionProfileDetails
      ...SubscriptionProfilesTastes
    }
    subscriptionAccountPricing {
      toPay
      salesPlan {
        minProfilesPriceValidation {
          minPrice
          result
          remainingAmount
        }
        packageOption {
          index
        }
      }
    }
    ...SubscriptionSummary
    ...SubscriptionEditDelivery
    ...BillingAddressSection
    ...SubscriptionAccountProfileDetails
  }
  nextSuggestion {
    id
    skip
    suggestionPricing {
      toPay
    }
    isBeingCharged
    currentOrderStreakProgress
    ...SubscriptionSummarySuggestion
    ...ProfileSelectorForSuggestionEditNextSuggestion
    ...MyDetailsMenuSuggestion
  }
}

fragment SubscriptionProfiles on SubscriptionProfileGraph {
  id
  isActive
  name
  email
  price
  productMap {
    quantity
  }
  products {
    id
    name
    quantity
    features
    isPromoted
  }
  allergens {
    id
    name
  }
  otherAllergens
  diet
  spicyLevel
  nutrition {
    goal
    preferences {
      energy {
        min
        max
      }
      proteins
      hydrates
      fats
    }
  }
  dislikes {
    id
    flavor
    texture
    name
  }
  otherDislikes {
    name
    flavor
    texture
  }
  character
}

