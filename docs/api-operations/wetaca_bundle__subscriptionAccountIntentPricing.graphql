query subscriptionAccountIntentPricing($subscriptionAccountInput: SubscriptionAccountInputGraphWithoutPayments!, $profiles: [SubscriptionProfileInputGraph!]!, $voucherCode: String) {
  subscriptionAccountIntentPricing(subscriptionAccountInput: $subscriptionAccountInput, profiles: $profiles, voucherCode: $voucherCode) {
    partialIntentPrices {
      appliedVouchers {
        code
        tagNames
        appliedDiscount
        discount {
          price
          percent
        }
      }
      voucherApplyErrors {
        ... on ApplyVoucherValidationError {
          errorCode
          description
          validationDetails {
            validationIssue
            voucher {
              code
              restrict {
                maximumAmount
                minimumAmount
                firstOrder
              }
            }
          }
        }
        ... on GraphError {
          errorCode
        }
      }
    }
    ...SubscriptionAcccountIntentPricing
  }
}

fragment SubscriptionAcccountIntentPricing on SubscriptionAccountIntentPricing {
  profiles {
    name
    transactional
    subscription
    toPay
  }
  profilesTotal {
    transactional
    subscription
    toPay
  }
  shipping
  shippingBreakdown {
    discount
  }
  salesPlanDiscount
  vouchers
  subscription {
    subtotal
    total
  }
  transactional {
    subtotal
    total
  }
  toPay
  segment {
    _id
    name
    slug
    tag
  }
  salesPlan {
    _id
    id
    minProfilesPriceValidation {
      minPrice
      result
      remainingAmount
    }
    packageOption {
      index
      categoryRestrictions {
        categories
        restriction {
          min
          max
        }
      }
      baseCategoryPrice
    }
    upselling {
      packageOption {
        index
        categoryRestrictions {
          categories
          restriction {
            min
            max
          }
        }
        baseCategoryPrice
      }
      packageValidation {
        result
        restrictions {
          categories
          result
          remaining
        }
      }
    }
    packageValidation {
      result
      restrictions {
        categories
        result
        remaining
      }
    }
  }
  appliedSalesPlanDiscount {
    appliedDiscount
    discount {
      price
      percent
    }
  }
  appliedVouchers {
    code
    tagNames
    appliedDiscount
    discount {
      price
      percent
    }
  }
  voucherApplyErrors {
    ... on ApplyVoucherValidationError {
      errorCode
      description
      validationDetails {
        validationIssue
        voucher {
          code
          restrict {
            maximumAmount
            minimumAmount
            firstOrder
          }
        }
      }
    }
    ... on GraphError {
      errorCode
    }
  }
}
