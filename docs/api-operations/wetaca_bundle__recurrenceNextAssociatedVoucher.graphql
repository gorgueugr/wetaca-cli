query recurrenceNextAssociatedVoucher {
  recurrenceVouchers: recurrenceNextAssociatedVoucher {
    recurrenceVoucher {
      code
      dateTo
      subscriptionDiscount {
        price
        percent
        maximum
      }
    }
    nextAssociatedVoucher {
      code
      dateTo
      dateFrom
      subscriptionDiscount {
        price
        percent
        maximum
      }
    }
  }
}
