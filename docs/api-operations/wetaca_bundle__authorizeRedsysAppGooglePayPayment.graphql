mutation authorizeRedsysAppGooglePayPayment($newPaymentIntentionRequest: SimplePaymentIntentionInput!, $paymentAuthorization: String!, $paymentInterfaceBrowser: PaymentInterfaceBrowserInput!, $paymentReferenceAlternative: String!) {
  authorizeRedsysAppGooglePayPayment(newPaymentIntentionRequest: $newPaymentIntentionRequest, paymentAuthorization: $paymentAuthorization, paymentInterfaceBrowser: $paymentInterfaceBrowser, paymentReferenceAlternative: $paymentReferenceAlternative) {
    ok
    error
    storedPaymentToken
    redsysAuthorizationResponse {
      isChallenge
      PAReq
      MD
      acsURL
      creq
      notificationUrl
      protocolVersion
    }
  }
}
